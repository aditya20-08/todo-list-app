<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App - Organize Your Tasks</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-check-circle"></i> TaskMaster</h1>
                <p>Stay organized and productive</p>
            </div>
        </header>

        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="todoInput" 
                        placeholder="Add a new task..." 
                        class="todo-input"
                        autocomplete="off"
                    >
                    <button id="addBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>
                <div class="input-options">
                    <select id="prioritySelect" class="priority-select">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <select id="categorySelect" class="category-select">
                        <option value="general">General</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="shopping">Shopping</option>
                        <option value="health">Health</option>
                    </select>
                </div>
            </section>

            <!-- Filter and Sort Section -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <div class="sort-buttons">
                    <button class="sort-btn" id="sortByDate">
                        <i class="fas fa-calendar"></i> Date
                    </button>
                    <button class="sort-btn" id="sortByPriority">
                        <i class="fas fa-arrow-up"></i> Priority
                    </button>
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="completedTasks" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <p id="pendingTasks" class="stat-number">0</p>
                </div>
                <div class="stat-card">
                    <h3>Completion Rate</h3>
                    <p id="completionRate" class="stat-number">0%</p>
                </div>
            </section>

            <!-- Todo List -->
            <section class="todos-section">
                <div id="todoList" class="todo-list">
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No tasks yet. Add one to get started!</p>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="action-section">
                <button id="clearCompleted" class="btn btn-secondary">
                    <i class="fas fa-trash"></i> Clear Completed
                </button>
                <button id="exportData" class="btn btn-secondary">
                    <i class="fas fa-download"></i> Export
                </button>
                <button id="clearAll" class="btn btn-danger">
                    <i class="fas fa-times"></i> Clear All
                </button>
            </section>
        </main>

        <footer class="footer">
            <p>TaskMaster © 2024 | Data saved locally on your device</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
